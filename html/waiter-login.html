        <svg onclick="GoBack()" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"

        <h1>ACESSO GARÇOM</h1>
        <p>Entre com suas credenciais</p>

        <form>
            <label>EMAIL DO GARÇOM</label>
            <div class="input-box">
                <input type="email" placeholder="garcom@outback.com.br">
            </div>

            <label>SENHA</label>
            <div class="input-box senha">
                <input type="password" placeholder="•••••••">
                <i class="fa-regular fa-eye"></i>
            </div>

            <button type="submit" class="btn">
                ENTRAR
            </button>
        </form>

        <a href="#" class="link">Esqueci minha senha</a>
