<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Outback</title>
    <link rel="stylesheet" href="../css/account-page.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/assets/logo-outback.png">
    <script defer src="../js/navigation.js"></script>
</head>

<body>
    <div>
        <div class="header">
            <div class="header-nav">
                <a href="https://www.outback.com.br/back-to-outback?utm_source=google-search&utm_medium=cpc&utm_campaign=outback_sazonal_bto-outback_high_cpc_google-ads_search&gad_source=1&gad_campaignid=23630513672&gbraid=0AAAAACW0DhebyA9MB72MxBK9mm2G9RfHR&gclid=Cj0KCQjw8PDPBhCeARIsAOJwmWW1COV_klpNdVLF4Qol-B5YVVgz5gkoBLj_pTzYMIsLkrYxxHkXyIIaAjIlEALw_wcB"
                    target="_blank">
                    <img class="logo" src="/assets/logo-outback.png" alt="Logo do Outback" width="200px">
                </a>
                <svg onclick="GoBack()" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="x-circle"
                    viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                    <path
                        d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
                </svg>
            </div>
        </div>

        <div class="long-line"></div>

        <div class="logo-position">
            <h1 class="title">COMO DESEJA CONTINUAR?</h1>
            <div class="separator">
                <div class="line"></div>
                <div class="circle"></div>
                <div class="line"></div>
            </div>

        </div>

        <div class="options">
            <div onclick="NavToMenu()" class="client">
                <div class="client-image">
                    <img src="/assets/client.png" alt="Imagem de um cliente">
                </div>
                <div class="client-info">
                    <h2 class="client-title">CLIENTE</h2>
                    <p class="client-description">Peça seus pratos favoritos com entrega rápida!</p>
                    <p class="client-continue">Clique para continuar</p>
                    <p class="arrow">▼</p>

                </div>
            </div>
            <div onclick="NavToWaiterLogin()" class="waiter">
                <div class="waiter-image">
                    <img src="/assets/waiter.png" alt="Imagem de um garçom">
                </div>
                <div class="waiter-info">
                    <h2 class="waiter-title">GARÇOM</h2>
                    <p class="waiter-description">Gerencie mesas e pedidos em tempo real!</p>
                    <p class="waiter-continue">Clique para continuar</p>
                    <p class="arrow">▼</p>

                </div>
            </div>

        </div>

    </div>


</body>

</html>
